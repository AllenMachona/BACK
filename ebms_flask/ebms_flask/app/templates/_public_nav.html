<nav class="public-nav" aria-label="Public navigation">
  <a class="logo-wrap" href="{{ url_for('dashboard.index') }}" aria-label="EBMS Botswana home">
    <span class="logo-mark">EBMS</span>
    <span class="logo-text">BOTSWANA<span>.</span></span>
  </a>

  <button class="public-nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="publicNavMenu">
    <i class="bi bi-list" aria-hidden="true"></i>
  </button>

  <div class="public-nav-menu" id="publicNavMenu">
    <ul class="nav-links">
      <li><a href="{{ url_for('dashboard.public_tenders') }}">Tenders</a></li>
      <li><a href="{{ url_for('dashboard.public_procurement_plans') }}">Procurement Plans</a></li>
      <li><a href="{{ url_for('dashboard.index') }}#procuring-entities">Procuring Entities</a></li>
      <li><a href="{{ url_for('dashboard.about') }}">About</a></li>
    </ul>

    <div class="nav-right">
      <a href="{{ url_for('auth.login') }}" class="nav-signin">Sign In</a>
      <a href="{{ url_for('auth.register') }}" class="nav-cta">Register as bidder</a>
    </div>
  </div>
</nav>
<script>
  (() => {
    const nav = document.currentScript.previousElementSibling;
    const toggle = nav.querySelector('.public-nav-toggle');
    const menu = nav.querySelector('#publicNavMenu');
    const closeMenu = () => {
      nav.classList.remove('is-open');
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', 'Open navigation');
      toggle.querySelector('i').className = 'bi bi-list';
    };
    toggle.addEventListener('click', () => {
      const isOpen = nav.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', String(isOpen));
      toggle.setAttribute('aria-label', isOpen ? 'Close navigation' : 'Open navigation');
      toggle.querySelector('i').className = isOpen ? 'bi bi-x-lg' : 'bi bi-list';
    });
    menu.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeMenu));
    document.addEventListener('click', (event) => {
      if (!nav.contains(event.target)) closeMenu();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeMenu();
    });
  })();
</script>
