<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background shield -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Shield outline -->
  <path d="M 60 10 L 95 30 L 95 55 Q 95 85 60 100 Q 25 85 25 55 L 25 30 Z" 
        fill="url(#shieldGradient)" stroke="#1e40af" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Lock icon inside shield -->
  <g transform="translate(60, 55) scale(1.2)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lock body -->
    <rect x="-6" y="-2" width="12" height="10" rx="1.5"/>
    <!-- Lock shackle -->
    <path d="M -4 -2 Q -4 -8 0 -8 Q 4 -8 4 -2"/>
    <!-- Lock keyhole -->
    <circle cx="0" cy="2" r="1.5" fill="white"/>
  </g>
  
  <!-- Accent circle -->
  <circle cx="60" cy="60" r="55" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" stroke-dasharray="5,3"/>
</svg>