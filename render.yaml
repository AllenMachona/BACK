services:
  - type: web
    name: ebms-flask
    runtime: python
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 wsgi:app
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SUBMISSION_ENCRYPTION_KEY
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false